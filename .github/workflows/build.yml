name: Build APK
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Projeyi ac
        run: |
          ls -la
          for f in *.zip; do unzip -oq "$f"; done
          ls -la MettoKlavye
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: APK derle
        run: gradle assembleDebug --no-daemon
        working-directory: MettoKlavye
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: MettoKlavye/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Metto Klavye ${{ github.run_number }}
          files: MettoKlavye/app/build/outputs/apk/debug/app-debug.apk
